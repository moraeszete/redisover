<svg viewBox="0 0 820 380" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666666"/>
    </marker>
  </defs>

  <!-- Redis instance -->
  <rect x="310" y="20" width="200" height="60" rx="10" fill="#d82c20" stroke="#a91f16" stroke-width="2"/>
  <text x="410" y="47" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="bold">Single Redis</text>
  <text x="410" y="65" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="bold">Instance</text>

  <!-- lines Redis -> apps -->
  <line x1="410" y1="80" x2="160" y2="138" stroke="#666666" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="410" y1="80" x2="410" y2="138" stroke="#666666" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="410" y1="80" x2="660" y2="138" stroke="#666666" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- app boxes -->
  <rect x="60" y="140" width="200" height="60" rx="10" fill="#147d92" stroke="#0d5664" stroke-width="2"/>
  <text x="160" y="175" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="bold">auth-app</text>

  <rect x="310" y="140" width="200" height="60" rx="10" fill="#147d92" stroke="#0d5664" stroke-width="2"/>
  <text x="410" y="175" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="bold">billing-app</text>

  <rect x="550" y="140" width="220" height="60" rx="10" fill="#147d92" stroke="#0d5664" stroke-width="2"/>
  <text x="660" y="175" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="bold">notifications-app</text>

  <!-- lines apps -> keys -->
  <line x1="160" y1="200" x2="160" y2="258" stroke="#666666" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="410" y1="200" x2="410" y2="258" stroke="#666666" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="660" y1="200" x2="660" y2="258" stroke="#666666" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- key badges -->
  <rect x="45" y="260" width="230" height="44" rx="8" fill="#f2c94c" stroke="#b58d18" stroke-width="1.5"/>
  <text x="160" y="287" text-anchor="middle" fill="#211f16" font-size="12.5" font-family="Consolas, Monaco, monospace">auth-app:user:123</text>

  <rect x="295" y="260" width="230" height="44" rx="8" fill="#f2c94c" stroke="#b58d18" stroke-width="1.5"/>
  <text x="410" y="287" text-anchor="middle" fill="#211f16" font-size="12.5" font-family="Consolas, Monaco, monospace">billing-app:user:123</text>

  <rect x="535" y="260" width="250" height="44" rx="8" fill="#f2c94c" stroke="#b58d18" stroke-width="1.5"/>
  <text x="660" y="287" text-anchor="middle" fill="#211f16" font-size="12.5" font-family="Consolas, Monaco, monospace">notifications-app:user:123</text>

  <!-- caption -->
  <text x="410" y="345" text-anchor="middle" fill="#666666" font-size="13" font-style="italic">Each app gets its own prefix — same logical key, no collisions.</text>
</svg>
