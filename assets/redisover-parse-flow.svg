<svg viewBox="0 0 820 480" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666666"/>
    </marker>
  </defs>

  <!-- start -->
  <rect x="270" y="20" width="280" height="60" rx="10" fill="#147d92" stroke="#0d5664" stroke-width="2"/>
  <text x="410" y="55" text-anchor="middle" fill="#ffffff" font-size="14.5" font-weight="bold" font-family="Consolas, Monaco, monospace">parse(key, value, ttl?)</text>

  <line x1="410" y1="80" x2="410" y2="118" stroke="#666666" stroke-width="2" marker-end="url(#arrow2)"/>

  <!-- decision diamond -->
  <polygon points="410,118 560,190 410,262 260,190" fill="#f2c94c" stroke="#b58d18" stroke-width="2"/>
  <text x="410" y="195" text-anchor="middle" fill="#211f16" font-size="14" font-weight="bold">Key already exists?</text>

  <!-- yes branch -->
  <line x1="260" y1="190" x2="185" y2="290" stroke="#666666" stroke-width="2" marker-end="url(#arrow2)"/>
  <text x="200" y="238" text-anchor="middle" fill="#0d5664" font-size="13" font-weight="bold">Yes</text>

  <!-- no branch -->
  <line x1="560" y1="190" x2="645" y2="290" stroke="#666666" stroke-width="2" marker-end="url(#arrow2)"/>
  <text x="622" y="238" text-anchor="middle" fill="#a91f16" font-size="13" font-weight="bold">No</text>

  <!-- left path: value exists -->
  <rect x="60" y="290" width="250" height="60" rx="10" fill="#147d92" stroke="#0d5664" stroke-width="2"/>
  <text x="185" y="326" text-anchor="middle" fill="#ffffff" font-size="13.5" font-weight="bold">Return the existing value</text>

  <line x1="185" y1="350" x2="185" y2="378" stroke="#666666" stroke-width="2" marker-end="url(#arrow2)"/>

  <rect x="85" y="380" width="200" height="44" rx="8" fill="#f2c94c" stroke="#b58d18" stroke-width="1.5"/>
  <text x="185" y="407" text-anchor="middle" fill="#211f16" font-size="13" font-family="Consolas, Monaco, monospace">{ created: false }</text>

  <!-- right path: value missing -->
  <rect x="520" y="290" width="250" height="60" rx="10" fill="#d82c20" stroke="#a91f16" stroke-width="2"/>
  <text x="645" y="317" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="bold">Store the new value</text>
  <text x="645" y="335" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="bold">(TTL applied if given)</text>

  <line x1="645" y1="350" x2="645" y2="378" stroke="#666666" stroke-width="2" marker-end="url(#arrow2)"/>

  <rect x="545" y="380" width="200" height="44" rx="8" fill="#f2c94c" stroke="#b58d18" stroke-width="1.5"/>
  <text x="645" y="407" text-anchor="middle" fill="#211f16" font-size="13" font-family="Consolas, Monaco, monospace">{ created: true }</text>

  <!-- caption -->
  <text x="410" y="455" text-anchor="middle" fill="#666666" font-size="13" font-style="italic">One call: read the cache, or write it if it's missing.</text>
</svg>
